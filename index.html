<body><div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;:&quot;#0000ff&quot;,&quot;nav&quot;:true,&quot;resize&quot;:true,&quot;page&quot;:0,&quot;dark-mode&quot;:&quot;auto&quot;,&quot;toolbar&quot;:&quot;pages zoom layers tags lightbox&quot;,&quot;edit&quot;:&quot;_blank&quot;,&quot;xml&quot;:&quot;&lt;mxfile host=\&quot;Electron\&quot; agent=\&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) draw.io/28.1.2 Chrome/138.0.7204.243 Electron/37.4.0 Safari/537.36\&quot; version=\&quot;28.1.2\&quot; pages=\&quot;2\&quot;&gt;\n  &lt;diagram name=\&quot;verbs\&quot; id=\&quot;QyxGaSP2FQRZusJz48_Q\&quot;&gt;\n    &lt;mxGraphModel dx=\&quot;1426\&quot; dy=\&quot;841\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;827\&quot; pageHeight=\&quot;1169\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;\n      &lt;root&gt;\n        &lt;mxCell id=\&quot;0\&quot; /&gt;\n        &lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; /&gt;\n        &lt;mxCell id=\&quot;smZRiqGAx4PjuGGHldTg-1\&quot; value=\&quot;&amp;lt;h3&amp;gt;🔑 Key Points&amp;lt;/h3&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;Dutch verbs fall into &amp;lt;strong&amp;gt;three big groups&amp;lt;/strong&amp;gt;:&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;ol start=&amp;quot;1&amp;quot;&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;strong&amp;gt;Irregular verbs (strong verbs + truly irregular ones like &amp;lt;/strong&amp;gt;&amp;lt;em&amp;gt;&amp;lt;strong&amp;gt;zijn&amp;lt;/strong&amp;gt;&amp;lt;/em&amp;gt;&amp;lt;strong&amp;gt;, &amp;lt;/strong&amp;gt;&amp;lt;em&amp;gt;&amp;lt;strong&amp;gt;hebben&amp;lt;/strong&amp;gt;&amp;lt;/em&amp;gt;&amp;lt;strong&amp;gt;, &amp;lt;/strong&amp;gt;&amp;lt;em&amp;gt;&amp;lt;strong&amp;gt;doen&amp;lt;/strong&amp;gt;&amp;lt;/em&amp;gt;&amp;lt;strong&amp;gt;, &amp;lt;/strong&amp;gt;&amp;lt;em&amp;gt;&amp;lt;strong&amp;gt;gaan&amp;lt;/strong&amp;gt;&amp;lt;/em&amp;gt;&amp;lt;strong&amp;gt;)&amp;lt;/strong&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;strong&amp;gt;Regular verbs (weak verbs)&amp;lt;/strong&amp;gt; — these follow predictable rules (&amp;lt;em&amp;gt;werken → werkte → gewerkt&amp;lt;/em&amp;gt;).&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;strong&amp;gt;Modal verbs&amp;lt;/strong&amp;gt; (&amp;lt;em&amp;gt;kunnen, moeten, willen, mogen, zullen&amp;lt;/em&amp;gt;) — irregular in present tense and past.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ol&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;The table we’ve been building is &amp;lt;strong&amp;gt;not every verb in Dutch&amp;lt;/strong&amp;gt;. Dutch has thousands of verbs, most of which are &amp;lt;strong&amp;gt;regular&amp;lt;/strong&amp;gt;.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;What we’re covering are the &amp;lt;strong&amp;gt;core irregulars + modals&amp;lt;/strong&amp;gt; — these are the ones you really need to memorize because they don’t follow the regular weak verb pattern.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;\&quot; style=\&quot;text;whiteSpace=wrap;html=1;fillColor=#FFFFE6;strokeColor=#d6b656;fontFamily=Verdana;fontSize=13;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;160\&quot; y=\&quot;80\&quot; width=\&quot;740\&quot; height=\&quot;310\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;smZRiqGAx4PjuGGHldTg-5\&quot; value=\&quot;&amp;lt;h2&amp;gt;1. Irregular &amp;amp;amp; Strong Verbs (must be memorized)&amp;lt;/h2&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;These don’t follow the weak verb rules. Present column only shows irregular hij/jij forms.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;\&quot; style=\&quot;text;whiteSpace=wrap;html=1;fontFamily=Verdana;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;170\&quot; y=\&quot;410\&quot; width=\&quot;610\&quot; height=\&quot;100\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;smZRiqGAx4PjuGGHldTg-6\&quot; value=\&quot;&amp;lt;table&amp;gt;&amp;lt;thead&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;th&amp;gt;Infinitive&amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp;&amp;lt;/th&amp;gt;&amp;lt;th&amp;gt;English&amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp;&amp;lt;/th&amp;gt;&amp;lt;th&amp;gt;Present&amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp;&amp;amp;nbsp;&amp;lt;/th&amp;gt;&amp;lt;th&amp;gt;Simple past (sg, pl)&amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp;&amp;lt;/th&amp;gt;&amp;lt;th&amp;gt;Past participle&amp;lt;/th&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;/thead&amp;gt;&amp;lt;tbody&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;&amp;lt;br&amp;gt;beginnen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;&amp;lt;br&amp;gt;to begin&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;&amp;lt;br&amp;gt;begin&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;&amp;lt;br&amp;gt;begon, begonnen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;&amp;lt;br&amp;gt;begonnen (+zijn)&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;blijven&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to stay&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;blijf&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;bleef, bleven&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gebleven (+zijn)&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;binden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to bind&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;bind&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;bond, bonden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gebonden&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;dragen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to carry&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;draag&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;droeg, droegen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gedragen&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;drinken&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to drink&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;drink&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;dronk, dronken&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gedronken&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;doen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to do&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;doe / doet&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;deed, deden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gedaan&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;eten&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to eat&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;eet&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;at, aten&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gegeten&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;geven&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to give&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;geef&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gaf, gaven&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gegeven&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;gaan&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to go&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;ga / gaat&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;ging, gingen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gegaan (+zijn)&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;hebben&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to have&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;heb / heeft&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;had, hadden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gehad&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;helpen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to help&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;help&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;hielp, hielpen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;geholpen&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;houden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to hold&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;houd&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;hield, hielden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gehouden&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;klimmen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to climb&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;klim&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;klom, klommen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;geklommen (+zijn)&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;klinken&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to sound&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;klink&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;klonk, klonken&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;geklonken&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;komen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to come&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;kom&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;kwam, kwamen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gekomen (+zijn)&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;krijgen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to get&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;krijg&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;kreeg, kregen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gekregen&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;lezen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to read&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;lees&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;las, lazen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gelezen&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;liggen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to lie&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;lig&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;lag, lagen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gelegen&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;lopen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to walk&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;loop&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;liep, liepen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gelopen (+zijn)&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;nemen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to take&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;neem&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;nam, namen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;genomen&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;raden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to guess&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;raad&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;ried/raadde, rieden/raadden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;geraden&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;rijden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to drive&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;rijd&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;reed, reden&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;gereden (+zijn possible)&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;roepen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to call&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;roep&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;riep, riepen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;geroepen&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;schrijven&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to write&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;schrijf&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;schreef, schreven&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;geschreven&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;slapen&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;to sleep&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;slaap&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;sliep uot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;160\&quot; y=\&quot;1470\&quot; width=\&quot;740\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;smZRiqGAx4PjuGGHldTg-41\&quot; value=\&quot;&amp;lt;h2&amp;gt;3. Regular (Weak) Verbs — Rule-Based&amp;lt;/h2&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;Most Dutch verbs are regular. You don’t need a list; you just need the rules:&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;\&quot; style=\&quot;text;whiteSpace=wrap;html=1;fontFamily=Verdana;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;160\&quot; y=\&quot;1660\&quot; width=\&quot;730\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;smZRiqGAx4PjuGGHldTg-42\&quot; value=\&quot;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;strong&amp;gt;Present tense:&amp;lt;/strong&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;em&amp;gt;ik&amp;lt;/em&amp;gt; = stem (e.g., &amp;lt;em&amp;gt;ik werk&amp;lt;/em&amp;gt;)&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;em&amp;gt;hij/jij&amp;lt;/em&amp;gt; = stem + -t (e.g., &amp;lt;em&amp;gt;hij werkt&amp;lt;/em&amp;gt;)&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;strong&amp;gt;Simple past:&amp;lt;/strong&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;If stem ends in a consonant from &amp;lt;strong&amp;gt;’t kofschip&amp;lt;/strong&amp;gt; (k, f, s, ch, p, t), add &amp;lt;strong&amp;gt;-te/-ten&amp;lt;/strong&amp;gt;.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;em&amp;gt;werken → werkte, werkten&amp;lt;/em&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;Otherwise, add &amp;lt;strong&amp;gt;-de/-den&amp;lt;/strong&amp;gt;.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;em&amp;gt;leren → leerde, leerden&amp;lt;/em&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;strong&amp;gt;Past participle:&amp;lt;/strong&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;Prefix &amp;lt;strong&amp;gt;ge-&amp;lt;/strong&amp;gt; + stem + ending.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;If stem ends in ’t kofschip consonant → &amp;lt;strong&amp;gt;-t&amp;lt;/strong&amp;gt;.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;em&amp;gt;werken → gewerkt&amp;lt;/em&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;Otherwise → &amp;lt;strong&amp;gt;-d&amp;lt;/strong&amp;gt;.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;em&amp;gt;leren → geleerd&amp;lt;/em&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;For separable verbs, &amp;lt;strong&amp;gt;ge-&amp;lt;/strong&amp;gt; goes in the middle: &amp;lt;em&amp;gt;opbellen → opgebeld&amp;lt;/em&amp;gt;.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;For verbs with prefixes (be-, ge-, ver-, ont-, her-), no extra &amp;lt;strong&amp;gt;ge-&amp;lt;/strong&amp;gt;: &amp;lt;em&amp;gt;bezoeken → bezocht&amp;lt;/em&amp;gt;.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;\&quot; style=\&quot;text;whiteSpace=wrap;html=1;fontFamily=Verdana;fontSize=13;fillColor=light-dark(#fff6eb, #36210a);strokeColor=#d79b00;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;160\&quot; y=\&quot;1760\&quot; width=\&quot;740\&quot; height=\&quot;500\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n      &lt;/root&gt;\n    &lt;/mxGraphModel&gt;\n  &lt;/diagram&gt;\n  &lt;diagram id=\&quot;OytbYst4EE4C-KhCZX75\&quot; name=\&quot;Page-2\&quot;&gt;\n    &lt;mxGraphModel dx=\&quot;1042\&quot; dy=\&quot;626\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;827\&quot; pageHeight=\&quot;1169\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;\n      &lt;root&gt;\n        &lt;mxCell id=\&quot;0\&quot; /&gt;\n        &lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; /&gt;\n        &lt;mxCell id=\&quot;eZLtvNq60Nc6tv8XqW6j-1\&quot; value=\&quot;&amp;lt;b&amp;gt;&amp;lt;font style=&amp;quot;color: rgb(255, 181, 112);&amp;quot;&amp;gt;dfsgjksg&amp;lt;/font&amp;gt;&amp;lt;/b&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;dashed=1;dashPattern=8 8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;120\&quot; y=\&quot;80\&quot; width=\&quot;120\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;eZLtvNq60Nc6tv8XqW6j-2\&quot; value=\&quot
